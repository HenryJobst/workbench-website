# Primäres Repo ist GitLab (privat); spiegelt main nach dem öffentlichen GitHub-Repo
# HenryJobst/workbench-website, das die Seite über GitHub Pages ausliefert.
#
# CI/CD-Variable im Projekt (Einstellungen -> CI/CD -> Variablen, maskiert):
#   GH_WEBSITE_MIRROR_TOKEN   Fine-grained GitHub-PAT, nur für dieses eine Repo,
#                             Contents: Read and write.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Node-eigener Testrunner (keine Abhängigkeiten), prüft u. a. js/workflow-diagramm-script.js
# gegen die generierten Workflow-Daten. Default-Stage-Reihenfolge (test vor deploy) reicht,
# keine eigene stages:-Liste nötig.
test:
  stage: test
  image: node:22-bookworm
  script:
    - node --test

mirror-to-github:
  stage: deploy
  needs: ["test"]
  image: node:22-bookworm
  script:
    - apt-get update -qq > /dev/null && apt-get install -y -qq git > /dev/null
    # Vollqualifizierte Ziel-Ref nötig: Beim allerersten Push ist das GitHub-Repo komplett leer, git kann
    # "main" ohne "refs/heads/"-Präfix nicht zuordnen, da es dort noch keinen passenden Ref gibt.
    - git push "https://gitlab-ci-token-unused:${GH_WEBSITE_MIRROR_TOKEN}@github.com/HenryJobst/workbench-website.git" "HEAD:refs/heads/main"
